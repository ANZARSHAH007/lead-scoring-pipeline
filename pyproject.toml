[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "leadscore"
version = "0.1.0"
description = "Scores a sales lead 0-100 on arrival, with three reasons why."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Runtime dependencies for the whole pipeline. Lower bounds, not pins: the lockfile
# (uv.lock or requirements.lock) is what makes a build reproducible.
# Phase 1 only needs pydantic + pydantic-settings; `make install-min` installs that subset
# so the test suite runs without downloading the ML stack. See docs/11.
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "pandas>=2.2",
  "pandera>=0.20",
  "scikit-learn>=1.5",
  "lightgbm>=4.5",
  "optuna>=3.6",
  "mlflow>=3.1",          # 3.x only: the plain file store was retired, see D-017
  # Transitive, pinned on purpose: MLflow 3.18 declares a `lazy="noload"` relationship
  # that SQLAlchemy 2.1 deprecates, which turns into a test failure under our strict
  # warning filter. Nothing in the dependency set needs 2.1. Revisit when MLflow does.
  "sqlalchemy>=2.0,<2.1",
  "shap>=0.46",
  "joblib>=1.4",
  "matplotlib>=3.9",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "streamlit>=1.39",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.7",
  # Starlette 1.10 moved TestClient onto httpx2; plain `httpx` is not enough and the
  # import fails with a message naming the right package. See docs/14, D-024.
  "httpx2>=0.1",         # FastAPI TestClient, from Phase 5
]

[project.urls]
Repository = "https://github.com/nextlevelbuilder/lead-scoring-pipeline"

[tool.hatch.build.targets.wheel]
packages = ["src/leadscore"]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # import sorting
  "B",        # bugbear
  "UP",       # pyupgrade
  "SIM",      # simplify
  "RUF",      # ruff-specific
  "PD",       # pandas-vet
  "NPY",      # numpy
  "S",        # bandit: flags the risky things doc 09 cares about
]
ignore = [
  "E501",     # line length is enforced by the formatter, not the linter
  "S101",     # assert is how pytest works
]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["ALL"]          # notebooks explore; they are not production code
"tests/*" = ["S", "PD901"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --strict-markers --strict-config"
markers = [
  "needs_data: requires the real Leads.csv on disk (not run in CI on pull requests)",
  "needs_model: requires a trained model artifact",
]
# A deprecation is a failure, with no exceptions. The one exception this project briefly
# carried was removed by pinning sqlalchemy<2.1 instead of silencing it — see docs/14, D-019.
filterwarnings = ["error::DeprecationWarning"]

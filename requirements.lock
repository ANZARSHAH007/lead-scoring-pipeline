# Resolved dependency set for the Lead Scoring Pipeline — DO NOT hand-edit.
#
# Why this file exists: in Phase 3 MLflow moved to 3.18 under a floating `mlflow>=2.16`
# lower bound and retired the plain file store, which broke tracking with no code change
# on our side (D-017). Lower bounds in pyproject.toml say what the project needs; this
# file says what actually worked, so a second machine and CI install the same thing.
#
# Two pins are deliberate rather than incidental:
#   sqlalchemy stays below 2.1, because MLflow 3.18 declares a `lazy="noload"`
#     relationship that 2.1 deprecates (D-019);
#   httpx2 rather than httpx, because Starlette 1.10 moved TestClient onto it (D-024).
#
# Regenerate deliberately, never casually:
#   .venv/Scripts/python -m pip freeze --exclude-editable > requirements.lock
#   .venv/Scripts/python scripts/doctor.py && .venv/Scripts/python -m pytest
# then record the upgrade in docs/14.
#
# Generated 2026-11-19 on Python 3.11.9, Windows 11. 114 packages.

